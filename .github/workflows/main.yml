name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [multinex-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main site repo
        uses: actions/checkout@v4
        with:
          path: main-site

      - name: Checkout Multinex repo
        uses: actions/checkout@v4
        with:
          repository: albrateanu/multinex-hub
          path: multinex-hub
          token: ${{ secrets.MULTINEX_REPO_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: multinex-hub
        run: npm ci

      - name: Build Multinex
        working-directory: multinex-hub
        run: npm run build

      - name: Debug built index
        run: |
          echo "----- dist/index.html -----"
          cat multinex-hub/dist/index.html

      - name: Prepare Pages artifact
        run: |
          mkdir -p out
          cp -R main-site/* out/ || true
          mkdir -p out/Multinex
          rsync -av --delete multinex-hub/dist/ out/Multinex/

      - name: Ensure main site entry exists
        run: |
          test -f out/index.html
          test -f out/Multinex/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
