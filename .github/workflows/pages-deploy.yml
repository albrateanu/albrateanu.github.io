name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [multinex-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main site repo
        uses: actions/checkout@v4
        with:
          path: main-site

      - name: Checkout Multinex repo
        uses: actions/checkout@v4
        with:
          repository: albrateanu/multinex-hub
          path: multinex-hub
          token: ${{ secrets.MULTINEX_REPO_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install main site dependencies
        working-directory: main-site
        run: npm ci

      - name: Build main site
        working-directory: main-site
        run: npx vite build --base=/

      - name: Install Multinex dependencies
        working-directory: multinex-hub
        run: npm ci

      - name: Build Multinex
        working-directory: multinex-hub
        run: npx vite build --base=/multinex/

      - name: Prepare Pages artifact
        run: |
          mkdir -p out
          rsync -av --delete main-site/dist/ out/
      
          mkdir -p out/multinex
          rsync -av --delete multinex-hub/dist/ out/multinex/

          # Create redirect for /Multinex → /multinex
          mkdir -p out/Multinex
          cat <<EOF > out/Multinex/index.html
          <!doctype html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=/multinex/" />
              <script>
                window.location.replace("/multinex/" + window.location.search + window.location.hash);
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - name: Ensure entries exist
        run: |
          test -f out/index.html
          test -f out/multinex/index.html
          test -f out/Multinex/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
